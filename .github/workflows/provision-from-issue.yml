name: Provision repo from issue request

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  provision:
    if: contains(github.event.issue.labels.*.name, 'repo-request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse assignment code from issue body
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const match = body.match(/###\s*Assignment\s*\n+\s*([A-Za-z0-9]+)/);
            core.setOutput("code", match ? match[1].toUpperCase() : "");
            core.setOutput("username", context.payload.issue.user.login);

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install PyGithub requests pynacl

      - name: Provision repo
        id: provision
        env:
          PROVISION_PAT: ${{ secrets.PROVISION_PAT }}
          MOODLE_URL: ${{ secrets.MOODLE_URL }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
          GITHUB_USERNAME: ${{ steps.parse.outputs.username }}
          ASSIGNMENT_CODE: ${{ steps.parse.outputs.code }}
        run: python provision_from_issue.py > result.md 2> error.log
        continue-on-error: true

      - name: Comment result and close issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = fs.existsSync('result.md') && fs.readFileSync('result.md', 'utf8').trim()
              ? fs.readFileSync('result.md', 'utf8')
              : "Something went wrong and no result was produced. A staff member will need to look into this.";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: result,
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed",
            });
