name: Provision student repos

on:
  push:
    branches: [main]
    paths:
      - roster.csv
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no repos created)"
        type: boolean
        default: false

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install PyGithub requests pynacl

      - name: Run provisioning
        env:
          PROVISION_PAT: ${{ secrets.PROVISION_PAT }}
          MOODLE_URL: ${{ secrets.MOODLE_URL }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python provision_repos.py --roster roster.csv --dry-run
          else
            python provision_repos.py --roster roster.csv
          fi
