name: Backfill repo secrets on existing private repos

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no secrets written)"
        type: boolean
        default: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install PyGithub requests pynacl

      - name: Run backfill
        env:
          PROVISION_PAT: ${{ secrets.PROVISION_PAT }}
          MOODLE_URL: ${{ secrets.MOODLE_URL }}
          MOODLE_TOKEN: ${{ secrets.MOODLE_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python backfill_repo_secrets.py --dry-run
          else
            python backfill_repo_secrets.py
          fi
